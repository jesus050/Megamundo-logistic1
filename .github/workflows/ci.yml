name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Sintaxis PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l en todos los archivos del plugin
        run: |
          set -e
          find src tests megamundo-logistica.php -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Ejecutar tests
        run: vendor/bin/phpunit

  package:
    name: Empaquetar plugin
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Construir zip limpio del plugin
        run: |
          mkdir -p build/megamundo-logistica
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.refactor' \
            --exclude='.claude' \
            --exclude='tests' \
            --exclude='/vendor' \
            --exclude='node_modules' \
            --exclude='/build' \
            --exclude='.DS_Store' \
            --exclude='composer.json' \
            --exclude='phpunit.xml' \
            ./ build/megamundo-logistica/
          cd build && zip -rq megamundo-logistica.zip megamundo-logistica

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: megamundo-logistica
          path: build/megamundo-logistica.zip
          retention-days: 30
